<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
    #mensagem { padding: .6rem; border-radius: .5rem; margin-bottom: 1rem; display: none; }
    #mensagem.sucesso { display: block; background: #e6f4ea; color: #1e7e34; border: 1px solid #b7dfc0; }
    #mensagem.erro { display: block; background: #fdecea; color: #b3261e; border: 1px solid #f5c2c0; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="doador">Seu nome (doador)</label>
    <input id="doador" placeholder="Ex.: Padaria Central">
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar</button>
  </fieldset>

  <h2>Minhas doações</h2>
  <p>Informe seu nome no formulário acima para acompanhar suas doações.</p>
  <ul id="minhas"></ul>

  <h2>Doações disponíveis</h2>
  <label for="filtro-tipo">Filtrar por tipo</label>
  <input id="filtro-tipo" placeholder="Ex.: pão">
  <p id="mensagem"></p>
  <ul id="lista"></ul>

  <script>
    function mostrarMensagem(texto, tipo) {
      const mensagem = document.getElementById('mensagem');
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    async function carregar() {
      const tipo = document.getElementById('filtro-tipo').value.trim();
      const res = await fetch('/api/doacoes' + (tipo ? `?tipo=${encodeURIComponent(tipo)}` : ''));
      const doacoes = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Aceitar';
        botao.onclick = async () => {
          const res = await fetch(`/api/doacoes/${d.id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong: 'Minha ONG' })
          });
          const resultado = await res.json();
          if (res.ok) {
            mostrarMensagem(`Doação aceita em ${resultado.aceita_em}.`, 'sucesso');
          } else {
            mostrarMensagem(resultado.erro, 'erro');
          }
          carregar();
        };
        li.appendChild(botao);
        lista.appendChild(li);
      }
      carregarMinhas();
    }

    const SITUACAO = { disponivel: 'disponível', aceita: 'aceita' };

    async function carregarMinhas() {
      const doador = document.getElementById('doador').value.trim();
      const minhas = document.getElementById('minhas');
      minhas.innerHTML = '';
      if (!doador) return;
      const res = await fetch(`/api/doadores/${encodeURIComponent(doador)}/doacoes`);
      const doacoes = await res.json();
      if (!doacoes.length) {
        minhas.innerHTML = '<li>Você ainda não publicou doações.</li>';
        return;
      }
      for (const d of doacoes) {
        const li = document.createElement('li');
        const situacao = SITUACAO[d.status] ?? d.status;
        li.textContent = `${d.tipo} — ${d.quantidade}: ${situacao}`
          + (d.ong ? ` por ${d.ong} em ${d.aceita_em}` : '');
        minhas.appendChild(li);
      }
    }

    document.getElementById('filtro-tipo').oninput = carregar;
    document.getElementById('doador').onchange = carregarMinhas;

    document.getElementById('publicar').onclick = async () => {
      await fetch('/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: document.getElementById('tipo').value,
          quantidade: document.getElementById('quantidade').value,
          validade: document.getElementById('validade').value,
          doador: document.getElementById('doador').value
        })
      });
      carregar();
    };

    carregar();
  </script>
</body>
</html>
