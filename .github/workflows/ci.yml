name: CI

# Roda a cada push e a cada Pull Request.
# O PR só deve ser integrado com este check verde.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    # PostgreSQL 16 em contêiner, a mesma imagem do docker-compose.yml (ADR 0001).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pratocheio
          POSTGRES_PASSWORD: pratocheio
          POSTGRES_DB: pratocheio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pratocheio"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    # Banco da aplicação. Os testes ignoram esta variável e usam sempre
    # pratocheio_teste (ADR 0002).
    env:
      DATABASE_URL: postgres://pratocheio:pratocheio@localhost:5432/pratocheio

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar o banco de teste
        run: docker exec ${{ job.services.postgres.id }} createdb -U pratocheio pratocheio_teste

      - name: Verificar se o SQL está só na camada de dados (RNF-02)
        run: |
          if grep -rnE '\b(SELECT|INSERT|UPDATE|DELETE)\b' src/ | grep -v -e '^src/repositorio.js' -e '^src/db.js'; then
            echo "SQL fora de src/repositorio.js e src/db.js"
            exit 1
          fi

      - name: Rodar os testes
        run: npm test

      - name: Verificar se a aplicação sobe
        run: |
          npm start &
          sleep 3
          curl --fail http://localhost:3000/api/saude
